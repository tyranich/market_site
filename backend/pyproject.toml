[project]
name = "finchoice-api"
version = "0.1.0"
description = "API for the FinChoice offer comparison service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
